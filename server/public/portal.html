<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — Grandezza</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1C1917;
  --ivory:#F6F1E8;
  --gold:#B08D57;
  --gold-light:#D4B678;
  --serif:'Playfair Display', Didot, serif;
  --sans:'Jost', 'Helvetica Neue', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--charcoal);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.7;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:8vh 6vw 12vh}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,46px);margin:10px 0 6vh;letter-spacing:.02em}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(176,141,87,.25);padding:32px;margin-bottom:24px}
.card h2{font-family:var(--serif);font-weight:400;font-size:19px;margin-bottom:18px}
.status-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid rgba(176,141,87,.14)}
.status-row:first-of-type{border-top:none}
.status-row .k{color:rgba(246,241,232,.6);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.pill{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:10px;background:var(--gold);color:var(--charcoal)}
.site-link{color:var(--gold-light);text-decoration:none;border-bottom:1px solid rgba(212,182,120,.4)}
.post{padding:16px 0;border-top:1px solid rgba(176,141,87,.14)}
.post:first-of-type{border-top:none}
.post .meta{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-bottom:6px}
.post p{font-size:14.5px;color:rgba(246,241,232,.75);white-space:pre-wrap}
.empty{color:rgba(246,241,232,.45);font-size:14px}
.error{color:#e0a394;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Grandezza · Client Portal</p>
  <h1 id="clientName">Loading …</h1>

  <div class="card">
    <h2>Status</h2>
    <div id="statusBlock"></div>
  </div>

  <div class="card">
    <h2>Your site</h2>
    <div id="siteBlock"></div>
  </div>

  <div class="card">
    <h2>Marketing updates</h2>
    <div id="postsBlock"></div>
  </div>
</div>

<script>
var token=location.pathname.split('/').filter(Boolean).pop();
fetch('/api/portal/'+token).then(function(res){
  if(!res.ok)throw new Error('not found');
  return res.json();
}).then(function(data){
  document.getElementById('clientName').textContent=data.name;

  document.getElementById('statusBlock').innerHTML=
    '<div class="status-row"><span class="k">Onboarding</span><span class="pill">'+data.onboardingStatus+'</span></div>'+
    '<div class="status-row"><span class="k">Billing</span><span class="pill">'+data.billingStatus+'</span></div>';

  var siteEl=document.getElementById('siteBlock');
  if(data.sites.length===0){
    siteEl.innerHTML='<p class="empty">Your site hasn\'t been generated yet.</p>';
  }else{
    siteEl.innerHTML=data.sites.map(function(s){
      var link=s.url?'<a class="site-link" href="'+s.url+'" target="_blank" rel="noopener">'+s.url+'</a>':'not yet deployed';
      return '<div class="status-row"><span class="k">'+s.status+'</span><span>'+link+'</span></div>';
    }).join('');
  }

  var postsEl=document.getElementById('postsBlock');
  if(data.marketingPosts.length===0){
    postsEl.innerHTML='<p class="empty">No marketing content yet.</p>';
  }else{
    postsEl.innerHTML=data.marketingPosts.map(function(p){
      var d=new Date(p.createdAt).toLocaleDateString();
      return '<div class="post"><div class="meta">'+p.channel+' · '+d+'</div><p>'+p.content+'</p></div>';
    }).join('');
  }
}).catch(function(){
  document.getElementById('clientName').textContent='Not found';
  document.querySelector('.wrap').innerHTML+='<p class="error">This link isn\'t valid. Please check the URL Grandezza sent you.</p>';
});
</script>
</body>
</html>
